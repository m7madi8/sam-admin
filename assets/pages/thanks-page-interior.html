<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You - Interior Design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f1ea;
      --card: rgba(255, 253, 250, 0.92);
      --accent: #c8aa88;
      --accent-dark: #9d8367;
      --text: #3f3429;
      --muted: #6f6255;
      --success: #38b07a;
      --shadow: 0 24px 60px rgba(0,0,0,0.14);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 18% 20%, #ffffff 0%, #f2e6d9 36%, #e7dccc 70%, #decebf 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
      color: var(--text);
    }

    .card {
      width: min(720px, 100%);
      background: var(--card);
      border-radius: 26px;
      padding: 42px 36px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(200,170,136,0.22);
      position: relative;
      overflow: hidden;
      animation: rise 0.6s ease-out;
    }

    .card::before,
    .card::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(200,170,136,0.14), transparent 65%);
      filter: blur(2px);
      z-index: 0;
    }
    .card::before { top: -50px; right: -40px; }
    .card::after  { bottom: -70px; left: -50px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 999px;
      background: linear-gradient(120deg, var(--accent), var(--accent-dark));
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.2px;
      box-shadow: 0 12px 30px rgba(200,170,136,0.28);
      position: relative;
      z-index: 1;
    }

    .icon {
      width: 78px;
      height: 78px;
      border-radius: 20px;
      background: linear-gradient(145deg, #ffffff, #f2e9dc);
      border: 1px solid rgba(200,170,136,0.35);
      box-shadow: 0 12px 28px rgba(0,0,0,0.08);
      display: grid;
      place-items: center;
      font-size: 38px;
      color: var(--success);
      margin: 22px 0 12px;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 2.35rem;
      margin-bottom: 10px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: var(--text);
      position: relative;
      z-index: 1;
    }

    .subtitle {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 18px;
      font-size: 1.05rem;
      position: relative;
      z-index: 1;
    }

    .list {
      display: grid;
      gap: 10px;
      margin: 14px 0 30px;
      padding: 0;
      position: relative;
      z-index: 1;
    }

    .list li {
      list-style: none;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      color: var(--text);
      line-height: 1.5;
      background: rgba(200,170,136,0.08);
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(200,170,136,0.16);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.55);
    }

    .dot {
      width: 8px;
      height: 8px;
      margin-top: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 20px;
      border-radius: 14px;
      font-weight: 800;
      text-decoration: none;
      font-size: 1rem;
      transition: all 0.25s ease;
      border: 1px solid transparent;
      min-width: 170px;
    }

    .btn.primary {
      background: linear-gradient(120deg, var(--accent), var(--accent-dark));
      color: #fff;
      box-shadow: 0 12px 30px rgba(200,170,136,0.35);
    }
    .btn.primary:hover { transform: translateY(-2px); box-shadow: 0 16px 36px rgba(200,170,136,0.4); }

    .btn.ghost {
      background: #fff;
      color: var(--accent-dark);
      border-color: rgba(200,170,136,0.5);
    }
    .btn.ghost:hover { background: rgba(200,170,136,0.08); }

    .quick {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      color: var(--muted);
      font-size: 0.97rem;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .quick a {
      color: var(--accent-dark);
      font-weight: 800;
      text-decoration: none;
    }
    .quick a:hover { text-decoration: underline; }

    @media (max-width: 640px) {
      .card { padding: 32px 22px; border-radius: 20px; }
      h1 { font-size: 2rem; }
      .badge { width: 100%; justify-content: center; text-align: center; }
      .actions { flex-direction: column; }
      .btn { width: 100%; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* تحسين السكرول */
    ::-webkit-scrollbar { width: 12px; }
    ::-webkit-scrollbar-track { background: var(--bg); border-radius: 10px; }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(to bottom, var(--accent), var(--accent-dark));
      border-radius: 10px;
      border: 2px solid var(--bg);
    }
    ::-webkit-scrollbar-thumb:hover { background: linear-gradient(to bottom, var(--accent-dark), var(--accent)); }

    /* تحسين التمرير السلس */
    html { scroll-behavior: smooth; }

    /* تحسين الأداء */
    * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Interior request received</div>
    <div class="icon">✓</div>
    <h1>Thank you</h1>
    <p class="subtitle">
      Your interior design request is in. We’ll call or email within a few hours. For urgent notes, ping us on WhatsApp.
    </p>

    <div class="actions">
      <a class="btn primary" href="../../index.html">Back to Home</a>
      <a class="btn ghost" href="../../index2.html#interiorphotos">View Interior Projects</a>
    </div>
  </div>
</body>
</html>
