<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You - Interior Design</title>
  <link rel="icon" href="../images/beige-logo.png" type="image/png" sizes="128x128">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Inter:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f3ec;
      --card: rgba(255, 253, 250, 0.9);
      --accent: #c8aa88;
      --accent-dark: #a48868;
      --text: #3f3429;
      --muted: #706456;
      --shadow: 0 26px 60px rgba(0,0,0,0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    body {
      font-family: 'Cairo', 'Inter', sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(120% 140% at 20% 20%, rgba(200,170,136,0.18), transparent 40%),
        radial-gradient(110% 120% at 80% 10%, rgba(150,130,110,0.12), transparent 38%),
        linear-gradient(145deg, #fdfbf7 0%, #f4ebdf 60%, #efe4d7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 18px;
      color: var(--text);
    }

    .card {
      width: min(720px, 100%);
      background: var(--card);
      border-radius: 28px;
      padding: 46px 38px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(200,170,136,0.16);
      position: relative;
      overflow: hidden;
      isolation: isolate;
      text-align: center;
      animation: fadeUp 0.65s ease;
    }

    .card::before,
    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(220px 220px at 20% 30%, rgba(200,170,136,0.12), transparent 60%);
      z-index: -1;
      opacity: 0.9;
    }
    .card::after {
      background: radial-gradient(260px 260px at 80% 70%, rgba(164,136,104,0.1), transparent 60%);
    }

    .logo {
      width: 92px;
      height: 92px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
    }
    .logo img {
      width: 92px;
      height: 92px;
      object-fit: contain;
      display: block;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 999px;
      background: linear-gradient(120deg, var(--accent), var(--accent-dark));
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.2px;
      box-shadow: 0 12px 28px rgba(200,170,136,0.24);
      position: relative;
      z-index: 1;
      justify-content: center;
      margin: 0 auto 12px;
    }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 12px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    .subtitle {
      color: var(--muted);
      line-height: 1.7;
      margin: 0 auto 24px;
      font-size: 1.05rem;
      max-width: 620px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 20px;
      border-radius: 14px;
      font-weight: 800;
      text-decoration: none;
      font-size: 1rem;
      transition: all 0.22s ease;
      border: 1px solid transparent;
      min-width: 170px;
    }

    .btn.primary {
      background: linear-gradient(120deg, var(--accent), var(--accent-dark));
      color: #fff;
      box-shadow: 0 12px 30px rgba(200,170,136,0.35);
    }
    .btn.primary:hover { transform: translateY(-1px); box-shadow: 0 16px 36px rgba(200,170,136,0.35); }

    .btn.ghost {
      background: #fff;
      color: var(--accent-dark);
      border-color: rgba(200,170,136,0.5);
    }
    .btn.ghost:hover { background: rgba(200,170,136,0.08); }

    .note {
      text-align: center;
      color: var(--muted);
      font-size: 0.97rem;
      line-height: 1.55;
    }
    .note a { color: var(--accent-dark); font-weight: 800; text-decoration: none; }
    .note a:hover { text-decoration: underline; }

    @media (max-width: 640px) {
      .card { padding: 34px 22px; border-radius: 22px; }
      h1 { font-size: 2.05rem; }
      .btn { width: 100%; }
      .badge { width: 100%; justify-content: center; }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    html { scroll-behavior: smooth; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="../images/beige-logo.png" alt="Samar Ammar Interior Design Logo">
    </div>
    <div class="badge">Interior request received</div>
    <h1>Thank you</h1>
    <p class="subtitle">
      Your interior design request is in. We’ll call or email within a few hours. For urgent notes, ping us on WhatsApp.
    </p>

    <div class="actions">
      <a class="btn primary" href="../../index.html">Back to Home</a>
      <a class="btn ghost" href="index2.html#interiorphotos">View Interior Projects</a>
    </div>

  </div>
</body>
</html>
